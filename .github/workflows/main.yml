name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Nuclear cleanup
      run: |
        rm -rf ~/.gradle/
        rm -rf /tmp/.gradle*
        rm -rf $HOME/.gradle/
        find . -name "*.gradle*" -type f -delete 2>/dev/null || true
        find . -name ".gradle" -type d -exec rm -rf {} + 2>/dev/null || true
        
    - name: List project structure
      working-directory: android_motion_detector
      run: |
        echo "=== Project files ==="
        ls -la
        echo "=== Settings content ==="
        cat settings.gradle
        echo "=== Build content ==="
        head -10 build.gradle
        
    - name: Make gradlew executable
      working-directory: android_motion_detector
      run: chmod +x gradlew
        
    - name: Build with explicit paths
      working-directory: android_motion_detector
      run: |
        export GRADLE_USER_HOME=/tmp/gradle-home
        ./gradlew assembleDebug \
          --project-dir . \
          --gradle-user-home /tmp/gradle-home \
          --no-daemon \
          --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: motion-detector-apk
        path: android_motion_detector/app/build/outputs/apk/debug/app-debug.apk
