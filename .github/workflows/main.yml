name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Change to Android project directory
      run: cd android_motion_detector
      
    - name: Grant execute permission for gradlew
      working-directory: ./android_motion_detector
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, creating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew
        
    - name: Create gradle wrapper if missing
      working-directory: ./android_motion_detector
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Creating Gradle wrapper..."
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.2-wrapper.jar
        fi
        
    - name: Build APK
      working-directory: ./android_motion_detector
      run: |
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace --info
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: motion-detector-apk
        path: android_motion_detector/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Motion Detector v${{ github.run_number }}
        files: android_motion_detector/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
