name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, creating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew
        
    - name: Create gradle wrapper if missing
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Creating Gradle wrapper..."
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.2-wrapper.jar
        fi
        
    - name: Build APK
      run: |
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace --info
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: motion-detector-apk
        path: app/build/outputs/apk/debug/app-debug.apk
